<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Antalya Tram — next departures</title>
<meta name="theme-color" content="#0d1117">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #14181d; --dim: #5c6672;
    --line: #e2e6ea; --accent: #b3123c; --ok: #1c7c4a;
    --t1a: #d81e3f; --t1b: #1667c2; --t2: #97682a; --t3: #2f8f5b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --card: #161b22; --ink: #e8edf3; --dim: #98a3b0;
      --line: #262d36; --accent: #ff6b8a; --ok: #4bd189;
      --t1a: #ff5a76; --t1b: #5aa2ff; --t2: #d5a86a; --t3: #55c98b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0 14px 40px; background: var(--bg); color: var(--ink);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 620px; margin-inline: auto; -webkit-text-size-adjust: 100%;
  }
  header { padding: 18px 0 10px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  h1 { font-size: 19px; margin: 0; letter-spacing: -0.01em; }
  #clock { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--dim); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 10px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .chip {
    border: 1px solid var(--line); background: var(--card); border-radius: 999px;
    padding: 7px 13px; font-weight: 600; font-size: 14px;
  }
  .chip[aria-pressed="true"] { border-color: currentColor; }
  .chip.t1a[aria-pressed="true"] { color: var(--t1a); }
  .chip.t1b[aria-pressed="true"] { color: var(--t1b); }
  .chip.t2[aria-pressed="true"]  { color: var(--t2); }
  .chip.t3[aria-pressed="true"]  { color: var(--t3); }
  .dir { display: grid; gap: 6px; margin-bottom: 10px; }
  .dir button {
    text-align: left; border: 1px solid var(--line); background: var(--card);
    border-radius: 10px; padding: 9px 12px; font-size: 14px; color: var(--dim);
  }
  .dir button[aria-pressed="true"] { color: var(--ink); font-weight: 600; border-color: var(--ink); }
  label { display: block; font-size: 13px; color: var(--dim); margin: 12px 0 5px; }
  select {
    width: 100%; font: inherit; padding: 11px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
  }
  .row { display: flex; gap: 8px; align-items: center; }
  .row select { flex: 1; }
  #fav { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 10px 13px; }
  #board { margin: 16px 0 0; padding: 0; list-style: none; }
  #board li {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    margin-bottom: 8px; overflow: hidden;
  }
  .dep { display: flex; align-items: center; gap: 12px; padding: 12px 14px; width: 100%; background: none; border: 0; text-align: left; }
  .badge {
    font-weight: 700; font-size: 13px; padding: 3px 8px; border-radius: 6px;
    border: 1.5px solid currentColor; min-width: 46px; text-align: center;
  }
  .to { flex: 1; font-size: 14px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .when { text-align: right; font-variant-numeric: tabular-nums; }
  .when b { display: block; font-size: 19px; }
  .when span { font-size: 12px; color: var(--dim); }
  li.soon .when b { color: var(--accent); }
  .calls { margin: 0; padding: 2px 14px 12px; list-style: none; font-size: 13px; color: var(--dim); border-top: 1px dashed var(--line); }
  .calls li { display: flex; justify-content: space-between; padding: 3px 0; }
  .calls b { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink); }
  .empty { color: var(--dim); font-size: 14px; padding: 16px 2px; }
  footer { margin-top: 22px; font-size: 12px; line-height: 1.6; color: var(--dim); }
  footer a { color: inherit; }
  .favs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
  .favs button { font-size: 13px; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 11px; }
</style>
</head>
<body>
<header>
  <h1>Antalya Tram</h1>
  <div id="clock">--:--</div>
</header>

<div class="favs" id="favs" hidden></div>

<div class="chips" id="lines"></div>
<div class="dir" id="dirs"></div>

<label for="stop">Stop</label>
<div class="row">
  <select id="stop"></select>
  <button id="fav" type="button" title="Save this stop">☆</button>
</div>

<ul id="board"></ul>

<footer>
  <p id="src"></p>
  <p><strong>Scheduled times, not live positions.</strong> Antalya publishes no public
  real-time feed for the trams, so this is the official printed timetable counted down
  against the clock. A tram running late will not show as late here.</p>
</footer>

<script src="tram-data.js"></script>
<script src="tram.js"></script>
</body>
</html>
