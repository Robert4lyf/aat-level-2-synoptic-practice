  <!-- The course is one sequence even though the module map is grouped by LO.
       Number unfinished rows across the whole map rather than restarting at 1
       inside every outcome. Completed rows keep their check mark. -->
  <style>
    .c2-module { counter-reset: c2-lesson; }
    .c2-module .c2-lesson-row { counter-increment: c2-lesson; }
    .c2-module .c2-lesson-row:not(.is-done) .c2-step { font-size: 0; }
    .c2-module .c2-lesson-row:not(.is-done) .c2-step::before { content: counter(c2-lesson); font-size: 12px; }
  </style>
</head>
