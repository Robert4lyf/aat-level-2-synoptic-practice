  <meta name="theme-color" content="#091310" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="Study CIPS Level 2 Procurement and Supply Operations with syllabus-mapped lessons, checks and original practice questions.">

  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b6b57'/%3E%3Ctext x='50%25' y='50%25' font-size='36' text-anchor='middle' dominant-baseline='central'%3E%F0%9F%93%A6%3C/text%3E%3C/svg%3E">

<body data-subject="cips2">
  <script src="cips2-theme-bootstrap.js"></script>
  <a class="skip-link" href="#cipsApp">Skip to main content</a>
  <!-- THE SHARED APP HEADER, not a CIPS invention. Every other subject in this
       app renders this exact element out of styles.css and supplies only its own
       --header-bg gradient; CIPS had built a 121px light bar of its own, with a
       back-link where the others have a subject switcher and a lone theme icon
       where the others have a row of pill buttons. The markup below is
       index.html's, with the ids app.js binds swapped for the same ids
       cips2-page.js binds — same header, same shape, same 46px. -->
  <header data-app-chrome>
    <div class="header-left">
      <div>
        <!-- No aria-haspopup, which index.html's copy of this button carries and
             this one must not: there the caret opens a picker on the same page,
             here it goes to the picker's page. Announcing a menu that never
             opens is a worse promise than the plain one. -->
        <h1><button id="subjectSwitcherBtn" class="brand-switch" type="button"
                aria-label="Leave CIPS Level 2 and choose another subject"><span class="brand-name">📦 CIPS Level 2</span><span class="brand-caret" aria-hidden="true">▾</span></button></h1>
        <span class="sub">Certificate in Procurement and Supply Operations</span>
      </div>
    </div>
    <div class="header-right">
      <button class="icon-btn" id="darkToggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">🌙 Dark</button>
      <button class="icon-btn" id="homeNavBtn" type="button" aria-label="Go home">🏠 Home</button>
    </div>
  </header>
  <div class="c2-shell">
    <main id="cipsApp" tabindex="-1"></main>
  </div>
  <noscript><div class="c2-fatal"><h1>JavaScript is required</h1><p>This study tool needs JavaScript enabled.</p></div></noscript>

  <script src="chrome-offset.js"></script>
  <script src="nav-history.js"></script>
  <script src="progress-backup.js"></script>
  <script src="sync-config.js"></script>
  <script src="progress-sync.js"></script>
  <script src="cips2-l2m1-syllabus.js"></script>
  <script src="cips2-l2m1-learn-data.js"></script>
  <script src="cips2-l2m1-practice-data.js"></script>
  <script src="cips2-page.js"></script>
  <script src="cips2-register.js"></script>
</body>
</html>
