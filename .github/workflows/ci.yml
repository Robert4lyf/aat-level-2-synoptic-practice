name: CI

# Checks for this no-build static site: the data validators, the CSP-hash guard
# that prevents the inline-script regression fixed in PR #112, the gate that
# password-protects the deployed site, and the guitar module's engine, geometry
# and offline-cache gates.
#
# Every check is listed here individually rather than through `npm test`, so a
# failure names itself in the Actions UI instead of hiding inside one long red
# step. The cost of that is this file and package.json can drift: guitar's gates
# existed for five steps while this workflow ran none of them. `npm test` is the
# full list; check:workflow asserts that this file covers it.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify CSP whitelists every inline script
        run: npm run check:csp
      - name: Check the hosting password gate (fails closed, headers re-applied)
        run: npm run check:password
      - name: Check theme tokens (dark-mode alias staleness)
        run: npm run check:theme
      - name: Validate AAT question bank
        run: npm run validate:aat
      - name: Check question integrity (option shuffling, answer keys)
        run: npm run check:integrity
      - name: Check AAT Level 2 content quality (cues, explanations, depth, coverage)
        run: npm run check:aat2
      - name: Check AAT Level 1 syllabus integrity and coverage
        run: npm run check:aat1
      - name: Check AAT Level 1 content quality (cues, depth, pairing integrity)
        run: npm run check:aat1-quality
      - name: Check AAT Level 3 syllabus integrity and coverage
        run: npm run check:aat3
      - name: Check AAT Level 3 content quality (cues, depth, stale tax figures)
        run: npm run check:aat3-quality
      - name: Check progress backup merge (no data loss, idempotent)
        run: npm run check:backup
      - name: Check cross-device sync (version check, conflict retry, fail-safe)
        run: npm run check:sync
      - name: Validate story-mode data (marks, flags, reachable buckets)
        run: npm run validate:story
      - name: Validate French question data
        run: npm run validate:french
      - name: Check French learning quality
        run: npm run check:french-quality
      - name: Check the workflow runs every check in npm test
        run: npm run check:workflow
      - name: Test the guitar engine (pitch, geometry, scales, timing)
        run: npm run test:guitar-engine
      - name: Check every generated guitar shape is playable
        run: npm run check:guitar-playability
      - name: Check every chord voicing sounds right in its own tuning
        run: npm run check:guitar-voicings
      - name: Check every syllabus criterion is taught
        run: npm run check:guitar-coverage
      - name: Check lesson format and voice
        run: npm run check:guitar-quality
      - name: Check handedness is applied in one place only
        run: npm run check:guitar-handedness
      - name: Check a subject waits for its stylesheet before mounting
        run: npm run check:subject-assets
      - name: Check the service worker's lazy cache survives a version bump
        run: npm run check:sw-lazy

  render:
    # Separated because it is the only job needing a browser: it loads the real
    # site in Chromium and opens all seven subjects. Kept out of the checks job
    # so a Playwright install failure cannot mask a content failure.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Check every subject renders
        env:
          REQUIRE_PLAYWRIGHT: '1'
        run: npm run check:subjects
      - name: Check every lesson card opens and draws
        env:
          REQUIRE_PLAYWRIGHT: '1'
        run: npm run check:guitar-lessons
      - name: Check the guitar controls are styled and the tempo behaves
        env:
          REQUIRE_PLAYWRIGHT: '1'
        run: npm run check:guitar-controls
