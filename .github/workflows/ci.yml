name: CI

# Checks for this no-build static site: the data validators, the CSP-hash guard
# that prevents the inline-script regression fixed in PR #112, the gate that
# password-protects the deployed site, and the guitar module's engine, geometry
# and offline-cache gates.
#
# Every check is listed here individually rather than through `npm test`, so a
# failure names itself in the Actions UI instead of hiding inside one long red
# step. The cost of that is this file and package.json can drift: guitar's gates
# existed for five steps while this workflow ran none of them. `npm test` is the
# full list; check:workflow asserts that this file covers it.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify CSP whitelists every inline script
        run: npm run check:csp
      - name: Check the hosting password gate (fails closed, headers re-applied)
        run: npm run check:password
      - name: Check theme tokens (dark-mode alias staleness)
        run: npm run check:theme
      - name: Validate AAT question bank
        run: npm run validate:aat
      - name: Check question integrity (option shuffling, answer keys)
        run: npm run check:integrity
      - name: Check every equation an explanation states actually computes
        run: npm run check:arithmetic
      - name: Check AAT Level 2 content quality (cues, explanations, depth, coverage)
        run: npm run check:aat2
      - name: Check AAT Level 1 syllabus integrity and coverage
        run: npm run check:aat1
      - name: Check AAT Level 1 content quality (cues, depth, pairing integrity)
        run: npm run check:aat1-quality
      - name: Check AAT Level 3 syllabus integrity and coverage
        run: npm run check:aat3
      - name: Check the encoded Level 3 syllabus against the published specification
        run: npm run check:aat3-fidelity
      - name: Check CIPS Level 2 syllabus integrity
        run: npm run check:cips2
      - name: Check the encoded CIPS Level 2 syllabus against the reviewed source manifest
        run: npm run check:cips2-fidelity
      - name: Adversarially prove the CIPS syllabus gates reject representative corruption
        run: npm run check:cips2-adversarial
      - name: Check CIPS teaching coverage and practice-bank quality in every module
        run: npm run check:cips2-content
      - name: Adversarially prove the CIPS content gate rejects corruption in every module
        run: npm run check:cips2-content-adversarial
      - name: Check AAT Level 3 content quality (cues, depth, stale tax figures)
        run: npm run check:aat3-quality
      - name: Check a deploy reaches the reader (cache freshness)
        run: npm run check:cache-freshness
      - name: Check AAT Level 3 teaching prose is plain English
        run: npm run check:aat3-plain-english
      - name: Check the accuracy-over-time history is recorded, kept and merged
        run: npm run check:aat3-trend
      - name: Check AAT Level 3 practice summary (totals, most-mistakes ranking)
        run: npm run check:aat3-summary
      - name: Check no Level 3 question is answerable from option position
        run: npm run check:aat3-position
      - name: Check Level 3 multi-part tasks behave (grading, per-part feedback, no state leak)
        run: npm run check:aat3-task
      - name: Check Level 3 mistake memory (recorded, served, cleared, merges between devices)
        run: npm run check:aat3-mistakes
      - name: Check mixed practice is drawn to the exam weighting
        run: npm run check:aat3-weighting
      - name: Check the timed mock behaves like an exam (no feedback, weighted, reports by outcome)
        run: npm run check:aat3-mock
      - name: Check every VAT threshold in TPFB agrees with the governed tax data
        run: npm run check:vat-thresholds
      - name: Check a finished lesson names itself on the completion screen
        run: npm run check:lesson-complete
      - name: Check read-aloud on both players (every card, nothing silent, nothing outlives the card)
        run: npm run check:speech
      - name: Check the Level 1 timed mock (no feedback, weighted draw, mistake memory, reviewable)
        run: npm run check:aat1-mock
      - name: Check the Level 2 exams against the published specification (duration, marks, coverage)
        run: npm run check:aat2-exams
      - name: Check every Level 2 topic has its cheat sheets, and each is a sheet not a lesson
        run: npm run check:aat2-sheets
      - name: Check each self-rendering stylesheet matches its screens (no dead rules, no unstyled classes)
        run: npm run check:styles
      - name: Check written tasks (model hidden until earned, rubric marks at the pass mark)
        run: npm run check:written
      - name: Check retiring a question retires it (and that a mock still asks it)
        run: npm run check:retire
      - name: Check the next-step recommendation moves with the evidence and lands where it says
        run: npm run check:nextstep
      - name: Check the glossary agrees with the teaching and its flashcards are scheduled
        run: npm run check:glossary
      - name: Check spaced repetition on all three levels (one schedule, due selection, merge)
        run: npm run check:spaced
      - name: Check progress backup merge (no data loss, idempotent)
        run: npm run check:backup
      - name: Check cross-device sync (version check, conflict retry, fail-safe)
        run: npm run check:sync
      - name: Validate story-mode data (marks, flags, reachable buckets)
        run: npm run validate:story
      - name: Validate French question data
        run: npm run validate:french
      - name: Check French learning quality
        run: npm run check:french-quality
      - name: Check each level's reference drawer holds its own material and nothing its syllabus excludes
        run: npm run check:reference
      - name: Check no throwaway scratch file is tracked
        run: npm run check:scratch
      - name: Check the workflow runs every check in npm test
        run: npm run check:workflow
      - name: Test the guitar engine (pitch, geometry, scales, timing)
        run: npm run test:guitar-engine
      - name: Check every generated guitar shape is playable
        run: npm run check:guitar-playability
      - name: Check every chord voicing sounds right in its own tuning
        run: npm run check:guitar-voicings
      - name: Check every syllabus criterion is taught
        run: npm run check:guitar-coverage
      - name: Check no term is used before it is taught
        run: npm run check:guitar-prereq
      - name: Check lesson format and voice
        run: npm run check:guitar-quality
      - name: Check handedness is applied in one place only
        run: npm run check:guitar-handedness
      - name: Check a subject waits for its stylesheet before mounting
        run: npm run check:subject-assets
      - name: Check the service worker's lazy cache survives a version bump
        run: npm run check:sw-lazy

  render:
    # Separated because it is the only job needing a browser: it loads the real
    # site in Chromium and opens all subjects. Kept out of the checks job so a
    # Playwright install failure cannot mask a content failure.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Check every subject renders
        env:
          REQUIRE_PLAYWRIGHT: '1'
        run: npm run check:subjects
      - name: Check nothing on a Level 1 or Level 3 screen falls off a 390px phone
        env:
          REQUIRE_PLAYWRIGHT: '1'
        run: npm run check:layout
      - name: Check the pair of buttons under a graded question match
        env:
          REQUIRE_PLAYWRIGHT: '1'
        run: npm run check:answer-actions
      - name: Check no text is cut off where the reader cannot reach it
        env:
          REQUIRE_PLAYWRIGHT: '1'
        run: npm run check:clipped
      - name: Check the shared header works on the subjects that render themselves
        env:
          REQUIRE_PLAYWRIGHT: '1'
        run: npm run check:chrome
      - name: Check a timed paper cannot be lost by tapping back
        env:
          REQUIRE_PLAYWRIGHT: '1'
        run: npm run check:exit-guard
      - name: Check endless practice never ends, and ends properly when stopped
        env:
          REQUIRE_PLAYWRIGHT: '1'
        run: npm run check:endless
      - name: Check the on-screen calculator adds up and is wired to the answer box
        env:
          REQUIRE_PLAYWRIGHT: '1'
        run: npm run check:calculator
      - name: Check the back button steps through the app instead of leaving it
        env:
          REQUIRE_PLAYWRIGHT: '1'
        run: npm run check:back
      - name: Check pick lists and entry grids render, grade and stay sealed in a mock
        env:
          REQUIRE_PLAYWRIGHT: '1'
        run: npm run check:grid
      - name: Check each level has its own sound and one switch silences them all
        run: npm run check:sound
      - name: Check the 50 and 100 streak celebrations fire and differ per level
        env:
          REQUIRE_PLAYWRIGHT: '1'
        run: npm run check:milestones
      - name: Check folding, jumping and the glossary index still reach their targets
        env:
          REQUIRE_PLAYWRIGHT: '1'
        run: npm run check:nav
      - name: Check every lesson card opens and draws
        env:
          REQUIRE_PLAYWRIGHT: '1'
        run: npm run check:guitar-lessons
      - name: Check the guitar controls are styled and the tempo behaves
        env:
          REQUIRE_PLAYWRIGHT: '1'
        run: npm run check:guitar-controls
      - name: Check the CIPS L2M1 reader, practice, progress and subject-picker bridge
        env:
          REQUIRE_PLAYWRIGHT: '1'
        run: npm run check:cips2-render
      - name: Check CIPS L2M1 installs and reloads offline
        env:
          REQUIRE_PLAYWRIGHT: '1'
        run: npm run check:cips2-offline
      - name: Check no sticky bar hides behind the app header
        env:
          REQUIRE_PLAYWRIGHT: '1'
        run: npm run check:sticky-chrome
      - name: Adversarially prove the sticky-chrome gate rejects each regression
        env:
          REQUIRE_PLAYWRIGHT: '1'
        run: npm run check:sticky-chrome-adversarial
      - name: Check the tab you are on is readable on every subject, both themes
        env:
          REQUIRE_PLAYWRIGHT: '1'
        run: npm run check:tab-contrast
